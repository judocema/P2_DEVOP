
services:
  mysql:
    image: mysql:8.4
    container_name: cadastro-produtos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootProdutos@2026
      MYSQL_DATABASE: cadastro_produtos
      MYSQL_USER: appuser
      MYSQL_PASSWORD: Produtos@2026
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRootProdutos@2026"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: cadastro-produtos-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  dados_mysql:
