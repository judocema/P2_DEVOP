
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Cadastro de Produtos</h1>
            <p>Gerencie os produtos cadastrados no sistema</p>
        </header>

        <section class="card">
            <h2>Novo produto</h2>

            <form id="formProduto">
                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" required maxlength="150"
                           placeholder="Ex.: Teclado">
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" required maxlength="100"
                           placeholder="Ex.: Informática">
                </div>

                <div class="campo">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" required min="0"
                           step="0.01" placeholder="0,00">
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade em estoque</label>
                    <input type="number" id="quantidade" required min="0"
                           step="1" placeholder="0">
                </div>

                <button type="submit" id="btnCadastrar">
                    Cadastrar produto
                </button>
            </form>

            <p id="mensagem" role="status"></p>
        </section>

        <section class="card">
            <div class="lista-header">
                <h2>Produtos cadastrados</h2>
                <button type="button" id="btnListar" class="secundario">
                    Listar todos os produtos
                </button>
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos">
                        <tr>
                            <td colspan="5">Clique em "Listar todos os produtos".</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
